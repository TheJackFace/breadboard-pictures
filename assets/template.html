<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Steps</title>
<!-- Starting page for breadboard-pictures. Needs, next to this file:
       lib/breadboard_bundle.js   (fritzing.mjs bundle …)
       lib/breadboard.js          (copied from the skill's assets/)
     The example bundle for this page:
       fritzing.mjs bundle lib/breadboard_bundle.js --board full=core/breadboard2.fzp \
         --part res=core/resistor.fzp --part led=core/LED-generic-5mm_6852162_005.fzp \
         --part button=core/pushbutton_4_horizontal.fzp -->
<style>
  :root {
    --bg: #F4F3EF; --surface: #FFFFFF; --ink: #1D1F1E; --ink-soft: #5B605C; --rule: #D5D6CF;
    --accent: #2C6C63; --hole-bg: #FFF8DB;
    --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #151816; --surface: #1E2220; --ink: #E3E7E2; --ink-soft: #9AA59D; --rule: #353D38; --accent: #63BCAF; }
  }
  :root[data-theme="dark"] { --bg: #151816; --surface: #1E2220; --ink: #E3E7E2; --ink-soft: #9AA59D; --rule: #353D38; --accent: #63BCAF; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 var(--font); }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 96px; }
  h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.05; margin: 0 0 8px; }
  .lede { color: var(--ink-soft); margin: 0 0 24px; max-width: 64ch; }
  .step { display: grid; grid-template-columns: 48px 1fr; gap: 16px; padding: 20px 0; border-top: 1px solid var(--rule); }
  .step-n { font-size: 28px; font-weight: 700; color: var(--accent); text-align: right; line-height: 1.1; }
  .step h2 { font-size: 20px; margin: 0 0 6px; line-height: 1.3; }
  .step p { margin: 0 0 10px; max-width: 66ch; }
  .hole { font-family: var(--mono); font-weight: 700; background: var(--hole-bg); color: #1D1F1E;
          border: 1px solid #1D1F1E; border-radius: 99px; padding: 0 7px; white-space: nowrap; }
  figure { margin: 12px 0 0; }
  .figbox { background: #F7F7F4; border: 1px solid var(--rule); border-radius: 6px; padding: 8px; overflow: hidden; }
  .figbox svg { display: block; width: 100%; height: auto; }
  .credit { color: var(--ink-soft); font-size: 13px; margin-top: 40px; }
  @media (max-width: 600px) { .step { grid-template-columns: 30px 1fr; gap: 10px; } .step-n { font-size: 22px; } }
</style>

<main>
  <h1>LED with a button</h1>
  <p class="lede">Press the button and the LED lights. Each picture shows one thing to plug in: the new
  part in colour with its holes named, everything already on the board in grey.</p>
  <div id="steps"></div>
  <p class="credit" id="credit"></p>
</main>

<script src="lib/breadboard_bundle.js"></script>
<script src="lib/breadboard.js"></script>
<script>
// The REAL board decides these: which letter is printed on the top row, which rail is +.
const bb = BB.board("full", { rows: "JIHGFEDCBA", rails: { top: ["-", "+"], bottom: ["+", "-"] } });

const STEPS = [
  { title: "Resistor from the + rail to hole J10",
    body: `The <b>330 Ω resistor</b> (orange, orange, brown). One leg in the top + rail above
           column 10, the other in <span class="hole">J10</span>.`,
    now: [{ part: "res", bands: "330", at: { connector0: "T+10", connector1: "J10" }, label: "330 Ω" }] },
  { title: "LED from G10 to G14",
    body: `The <b>LED</b>. Its <b>longer leg</b> goes in <span class="hole">G10</span>, the same
           column as the resistor. The shorter leg, on the flat side of the rim, goes in
           <span class="hole">G14</span>.`,
    now: [{ part: "led", at: { anode: "G10", cathode: "G14" }, flip: true, label: "LED", labelAt: [3, -3] }] },
  { title: "Button across the centre channel",
    body: `The <b>square button</b> straddles the channel: legs in <span class="hole">F14</span>,
           <span class="hole">F16</span>, <span class="hole">E14</span> and <span class="hole">E16</span>.
           Column 14 is shared with the LED's short leg.`,
    now: [{ part: "button", at: { "Pin 1": "F16" }, label: "button", labelAt: [4, 0] }] },
  { title: "Wire from the button to the − rail",
    body: `A <b>black wire</b> from <span class="hole">A16</span> to the bottom − rail.`,
    now: [{ part: "@wire", from: "A16", to: "B-16", color: "black", bow: 0.8 }] },
  { title: "A chip, for comparison",
    body: `An 8-leg chip with its notch on the left, pin 1 in <span class="hole">E20</span>.`,
    now: [{ part: "@dip", pins: 8, pin1: "E20", text: "NE555", numbers: true, label: "IC1" }] },
];

const host = document.getElementById("steps");
let placed = [];
STEPS.forEach((st, i) => {
  const d = document.createElement("section");
  d.className = "step";
  d.innerHTML = `<div class="step-n">${i + 1}</div><div><h2>${st.title}</h2><p>${st.body}</p>` +
                `<figure><div class="figbox"></div></figure></div>`;
  host.appendChild(d);
  bb.figure(d.querySelector(".figbox"), { old: placed, now: st.now, view: { cols: [1, 26] }, alt: st.title });
  placed = placed.concat(st.now.map(({ label, labelAt, tags, ...p }) => p));
});
document.getElementById("credit").textContent = BB.credit();
</script>
</html>
